# Configuration for the BLE central / web dashboard app

ble:
  # On Raspberry Pi, hci0 is the internal radio and hci1 is typically the USB adapter.
  # Verify with `bluetoothctl list` after plugging in the USB adapter.
  adapter: "hci1"
  # Optional multi-adapter mode. Add every USB controller here to split satellites
  # deterministically between radios. Keep a single entry until the extra adapters exist.
  # adapters:
  #   - "hci1"
  #   - "hci2"
  #   - "hci3"
  # Used automatically when the preferred USB adapter is unavailable.
  fallback_adapter: "hci0"
  adapter_retry_delay_s: 10
  # Label shown in the dashboard for every satellite.
  device_name: "IMU Satellite"
  # Names actually broadcast by the firmwares; satellites advertising the IMU service UUID match too.
  advertised_names:
    - "IMU Capture"
    - "IMU Satellite"
  imu_service_uuid: "2a6f0001-8a7d-4e8b-9c7d-4b2a0b9c0001"
  imu_data_char_uuid: "2a6f0002-8a7d-4e8b-9c7d-4b2a0b9c0001"
  battery_data_char_uuid: "2a6f0003-8a7d-4e8b-9c7d-4b2a0b9c0001"
  battery_level_char_uuid: "00002a19-0000-1000-8000-00805f9b34fb"
  # Offline-buffering: written/subscribed on every (re)connect to sync the satellite's
  # clock and replay whatever it recorded while disconnected. Older firmwares without
  # these characteristics keep working; the app just skips offline replay for them.
  time_sync_char_uuid: "2a6f0004-8a7d-4e8b-9c7d-4b2a0b9c0001"
  imu_history_char_uuid: "2a6f0005-8a7d-4e8b-9c7d-4b2a0b9c0001"
  battery_history_char_uuid: "2a6f0006-8a7d-4e8b-9c7d-4b2a0b9c0001"
  sync_status_char_uuid: "2a6f0007-8a7d-4e8b-9c7d-4b2a0b9c0001"
  # RSSI is collected from BLE advertisements, which does not interfere with the GATT link.
  rssi_enabled: false
  rssi_char_uuid: "2a6f0008-8a7d-4e8b-9c7d-4b2a0b9c0001"
  # Standard Device Information Service / Firmware Revision String: read once per connection so
  # the dashboard can show the satellite's firmware version and flag when a newer one is available.
  device_info_service_uuid: "0000180a-0000-1000-8000-00805f9b34fb"
  firmware_version_char_uuid: "00002a26-0000-1000-8000-00805f9b34fb"
  # Recheck the firmware revision on live connections so USB flashes refresh the dashboard.
  firmware_version_refresh_s: 10
  scan_timeout_s: 10
  # Maximum duration of a GATT connection attempt before the session retries.
  connect_timeout_s: 10
  # Cap every GATT read/write/notification setup request. This keeps a satellite with a
  # stalled optional characteristic from blocking its reconnect loop indefinitely.
  gatt_setup_timeout_s: 3
  reconnect_delay_s: 1
  # Windows: always rediscover GATT services so firmware versions refresh after USB flashing.
  winrt_use_cached_services: false
  # Max wait for a fresh advertisement before retrying a connection (BlueZ drops silent devices).
  rediscover_timeout_s: 10
  # How often to log what the adapter sees while no satellite is found.
  scan_heartbeat_s: 30

web:
  host: "0.0.0.0"
  port: 80

database:
  # SQLite file storing devices/history so the web page keeps past data across restarts.
  path: "data.db"

# Keeps a 30-satellite deployment bounded: IMU is emitted by the firmware at 10 Hz,
# while dashboard and SQLite receive a representative 5 Hz sample per satellite.
telemetry:
  queue_maxsize: 5000
  websocket_imu_interval_ms: 200
  persistence_imu_interval_ms: 200

wifi_ap:
  ssid: "BLE-IMU-Central"
  # password is NOT stored here: copy secrets.example.yaml to secrets.yaml and set it there
  interface: "wlan0"
