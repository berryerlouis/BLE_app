name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Python sources
        run: |
          python -m compileall -q main.py ble_central
          python -c "import main; import ble_central.ble_client; import ble_central.models; import ble_central.server; import ble_central.update"

      - name: Check YAML configuration
        run: python -c "import yaml; [yaml.safe_load(open(path, encoding='utf-8')) for path in ('config.yaml', 'secrets.example.yaml')]"

      - name: Check JavaScript syntax
        run: |
          node --check static/js/*.js
          node --check static/js/views/*.js

      - name: Check shell script syntax
        run: bash -n scripts/*.sh